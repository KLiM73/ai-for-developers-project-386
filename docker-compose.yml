services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "3000:80"

  backend:
    build: ./backend
    ports:
      - "3001:80"
    volumes:
      - ./backend/storage:/rails/storage
      - ./backend/config/master.key:/rails/config/master.key:ro
